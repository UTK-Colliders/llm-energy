schema_version: 1
name: madgraph-ttbar2j-split
description: >
  The madgraph-ttbar2j-lhe physics, split into separately measured phases:
  Fortran code generation + compilation, then event generation. Same process,
  beams, event count, and seed — only the measurement boundary differs.

images:
  # The same image as madgraph-ttbar2j-lhe, built from that task's context so
  # there is one Dockerfile and one image tag to keep in sync.
  native:
    build:
      context: ../madgraph-ttbar2j-lhe
      dockerfile: Dockerfile
    tag: llm-energy/mg5amc:3.5.16

default_image: native

phases:
  # MG5 writes the process directory as Fortran source, then make builds it.
  # The final `ls` fails the phase loudly if the build did not actually produce
  # the executables the next phase needs — better than silently leaving the
  # compilation to be done inside the event-generation window.
  - name: codegen-compile
    description: matrix-element code generation and Fortran compilation
    command:
      - bash
      - -euc
      - |
        mg5_aMC /cards/ttbar2j_codegen.mg5
        cd /work/proc_pp_ttbar/Source && make -j"$(nproc)"
        for d in /work/proc_pp_ttbar/SubProcesses/P*/; do
          (cd "$d" && make madevent)
        done
        ls /work/proc_pp_ttbar/SubProcesses/P*/madevent

  # Reuses the built directory: this window should contain no compilation at
  # all, which `build_artifacts_written` on the phase result confirms.
  - name: event-generation
    description: unweighted event generation from the pre-built process
    command: ["mg5_aMC", "/cards/ttbar2j_launch.mg5"]

mounts:
  - source: cards
    target: /cards
    mode: ro
  - source: "{run_dir}"
    target: /work
    mode: rw

workdir: /work
env: {}
# ttbar+2j is a much bigger calculation than ttbar: many more
# subprocesses to generate and compile, and far slower unweighting.
timeout_s: 28800

expect:
  outputs:
    # run_01: the launch phase is the first run in this process directory
    - glob: "proc_pp_ttbar/Events/run_01/unweighted_events.lhe*"
      record_as: lhe_file

metadata:
  process: "p p > t t~ j j"
  order: LO
  ebeam1_gev: 6800
  ebeam2_gev: 6800
  nevents: 10000
  iseed: 42
  mg5_version_native: "3.5.16"
  split_of: madgraph-ttbar2j-lhe
