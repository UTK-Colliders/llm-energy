[project]
name = "llm-energy"
version = "0.1.0"
description = "Compare the energy an LLM consumes coordinating a HEP workflow task against the energy of running the task itself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "UTK Colliders" },
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
llm-energy = "llm_energy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_energy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
